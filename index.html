<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0f0a" />
  <title>한강 식물 AI</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #0a0f0a;
      --bg-surface:     #0f1a0f;
      --bg-elevated:    #132013;
      --border-dim:     #1e2e1e;
      --border-mid:     #2e4a2e;
      --border-bright:  #4a8a4a;
      --accent:         #6dbf6d;
      --accent-dim:     #4a8a4a;
      --text-primary:   #e8f5e8;
      --text-secondary: #8ab08a;
      --text-muted:     #4a6a4a;
      --invasive-bg:    #3a1010;
      --invasive-border:#6a2020;
      --invasive-text:  #f08080;
      --native-bg:      #0f2a1a;
      --native-border:  #2a5a2a;
      --native-text:    #6dbf6d;
      --radius-md:      16px;
      --radius-lg:      24px;
    }

    html, body {
      height: 100%;
      background: #050a05;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── App Shell ── */
    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .app::before {
      content: '';
      position: fixed;
      inset: 0;
      max-width: 430px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .app > * { position: relative; z-index: 1; }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
    .status-right { display: flex; align-items: center; gap: 6px; }
    .signal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-dim); }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 24px 12px;
    }
    .app-title    { font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.8px; line-height: 1.1; }
    .app-subtitle { font-size: 10px; color: var(--text-muted); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px; }
    .region-badge {
      background: var(--bg-elevated);
      border: 0.5px solid var(--border-mid);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* ── Camera Viewport ── */
    .viewport-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 20px 0;
      gap: 14px;
    }
    .camera-viewport {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      border: 0.5px solid var(--border-mid);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .camera-viewport.scanning        { border-color: var(--accent); }
    .camera-viewport.result-invasive { border-color: #c04040; }
    .camera-viewport.result-native   { border-color: var(--accent); }

    #videoFeed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-lg);
      display: none;
    }
    #videoFeed.active { display: block; }
    #captureCanvas { display: none; }

    .corner { position: absolute; width: 24px; height: 24px; transition: border-color 0.4s; }
    .corner-tl { top: 14px; left: 14px;  border-top: 2px solid var(--border-bright); border-left:  2px solid var(--border-bright); border-radius: 5px 0 0 0; }
    .corner-tr { top: 14px; right: 14px; border-top: 2px solid var(--border-bright); border-right: 2px solid var(--border-bright); border-radius: 0 5px 0 0; }
    .corner-bl { bottom: 14px; left: 14px;  border-bottom: 2px solid var(--border-bright); border-left:  2px solid var(--border-bright); border-radius: 0 0 0 5px; }
    .corner-br { bottom: 14px; right: 14px; border-bottom: 2px solid var(--border-bright); border-right: 2px solid var(--border-bright); border-radius: 0 0 5px 0; }
    .scanning .corner-tl,
    .scanning .corner-tr,
    .scanning .corner-bl,
    .scanning .corner-br { border-color: var(--accent); }

    .scan-line {
      position: absolute;
      left: 6%; width: 88%; height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, var(--accent-dim) 20%, var(--accent) 50%, var(--accent-dim) 80%, transparent 100%);
      top: 10%; opacity: 0; transition: opacity 0.3s;
    }
    .scanning .scan-line { opacity: 1; animation: scanMove 2.2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes scanMove { 0%{top:10%} 50%{top:80%} 100%{top:10%} }

    .viewport-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.3s;
    }
    .viewport-idle .idle-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 0.5px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 32px;
    }
    .viewport-idle .idle-text {
      font-size: 13px; color: var(--text-muted);
      letter-spacing: 0.2px; text-align: center; line-height: 1.5;
    }
    .camera-viewport.scanning .viewport-idle { opacity: 0.3; }
    .camera-viewport.has-video .viewport-idle { display: none; }

    .scan-label {
      position: absolute; bottom: 16px;
      font-size: 10px; font-weight: 600; letter-spacing: 2px;
      color: var(--accent); text-transform: uppercase;
      opacity: 0; transition: opacity 0.3s;
    }
    .scanning .scan-label { opacity: 1; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Result Panel ── */
    .result-panel {
      width: 100%;
      background: var(--bg-surface);
      border: 0.5px solid var(--border-dim);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      min-height: 78px;
      display: flex; flex-direction: column; justify-content: center;
      transition: border-color 0.4s;
    }
    .result-panel.invasive { border-color: var(--invasive-border); }
    .result-panel.native   { border-color: var(--native-border); }

    .result-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; }
    .result-idle  { font-size: 13px; color: var(--text-muted); }
    .result-name  { font-size: 16px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .result-latin { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-style: italic; }
    .result-meta  { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    }
    .status-badge.invasive { background: var(--invasive-bg); border: 0.5px solid var(--invasive-border); color: var(--invasive-text); }
    .status-badge.native   { background: var(--native-bg);   border: 0.5px solid var(--native-border);   color: var(--native-text); }
    .confidence-text { font-size: 11px; color: var(--text-muted); }

    .confidence-bar  { margin-top: 8px; height: 3px; border-radius: 2px; background: var(--bg-elevated); overflow: hidden; }
    .confidence-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.9s cubic-bezier(0.4,0,0.2,1), background 0.4s; }

    /* ── Shutter Area ── */
    .shutter-area {
      display: flex; align-items: center; justify-content: center;
      gap: 36px; padding: 10px 0 14px;
    }
    .side-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--bg-surface); border: 0.5px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .side-btn:hover  { background: var(--bg-elevated); color: var(--text-secondary); }
    .side-btn:active { transform: scale(0.92); }
    .side-btn i { font-size: 20px; }

    .shutter-btn {
      width: 76px; height: 76px; border-radius: 50%;
      background: var(--text-primary); position: relative;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 0 0 7px var(--bg-elevated), 0 0 0 8px var(--border-mid);
      -webkit-tap-highlight-color: transparent;
    }
    .shutter-btn:hover  { transform: scale(1.04); }
    .shutter-btn:active { transform: scale(0.94); }
    .shutter-btn.scanning { box-shadow: 0 0 0 7px var(--bg-elevated), 0 0 0 9px var(--accent); }

    .shutter-inner {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--text-primary); border: 2px solid #c8e0c8;
      display: flex; align-items: center; justify-content: center;
    }
    .shutter-inner i { font-size: 24px; color: var(--bg-base); }

    .pulse-ring { position: absolute; inset: -8px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0; }
    .shutter-btn.scanning .pulse-ring { animation: pulseRing 1.6s ease-out infinite; }
    .shutter-btn.scanning .pulse-ring:nth-child(2) { animation-delay: 0.55s; }
    @keyframes pulseRing { 0%{transform:scale(0.85);opacity:0.7} 100%{transform:scale(1.5);opacity:0} }

    /* ── Bottom Nav ── */
    .bottom-nav {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      border-top: 0.5px solid var(--border-dim);
      background: var(--bg-base);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; color: var(--text-muted); transition: color 0.2s;
      padding: 4px 20px; -webkit-tap-highlight-color: transparent;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item i   { font-size: 22px; }
    .nav-item span { font-size: 9px; font-weight: 500; letter-spacing: 0.5px; }
    .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: -2px; opacity: 0; transition: opacity 0.2s; }
    .nav-item.active .nav-dot { opacity: 1; }

    /* ── Animations ── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .header          { animation: fadeUp 0.5s       ease both; }
    .camera-viewport { animation: fadeUp 0.5s 0.10s ease both; }
    .result-panel    { animation: fadeUp 0.5s 0.18s ease both; }
    .shutter-area    { animation: fadeUp 0.5s 0.26s ease both; }
    .bottom-nav      { animation: fadeUp 0.5s 0.34s ease both; }

    /* ── 모델 로딩 / 오류 배너 ── */
    .demo-banner {
      background: #1a1a0a;
      border-bottom: 0.5px solid #3a3a10;
      padding: 6px 20px;
      font-size: 11px;
      color: #a0a040;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Teachable Machine 클라이언트 추론 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>

<div class="app" id="app">

  <div class="status-bar">
    <span id="clockDisplay">9:41</span>
    <div class="status-right">
      <div class="signal-dot"></div>
      <div class="signal-dot"></div>
      <div class="signal-dot"></div>
      <i class="ti ti-battery-2" style="font-size:16px;color:var(--text-muted);"></i>
    </div>
  </div>

  <!-- 모델 로딩 중 / 로딩 실패 시 표시 (JS에서 제어) -->
  <div class="demo-banner" id="demoBanner">⏳ AI 모델을 불러오는 중입니다...</div>

  <div class="header">
    <div>
      <div class="app-title">한강 식물 AI</div>
      <div class="app-subtitle">교란종 판별 시스템</div>
    </div>
    <div class="region-badge">한강유역</div>
  </div>

  <div class="viewport-wrap">

    <div class="camera-viewport" id="viewport" onclick="handleViewportTap()">
      <video id="videoFeed" autoplay playsinline muted></video>
      <canvas id="captureCanvas" width="640" height="640"></canvas>

      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>

      <div class="viewport-idle">
        <div class="idle-icon"><i class="ti ti-plant-2" aria-hidden="true"></i></div>
        <div class="idle-text">식물을 카메라에 비추거나<br>촬영 버튼을 눌러주세요</div>
      </div>
      <div class="scan-label">AI 분석 중</div>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-label">판별 결과</div>
      <div class="result-idle" id="resultContent">촬영 후 결과가 여기에 표시됩니다</div>
    </div>

  </div>

  <div class="shutter-area">
    <div class="side-btn" onclick="openGallery()" title="갤러리에서 선택">
      <i class="ti ti-photo" aria-hidden="true"></i>
    </div>
    <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleGalleryImage(event)" />

    <div class="shutter-btn" id="shutterBtn" onclick="triggerCapture()" aria-label="식물 촬영">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="shutter-inner">
        <i class="ti ti-camera" aria-hidden="true" id="shutterIcon"></i>
      </div>
    </div>

    <div class="side-btn" onclick="showHistory()" title="스캔 기록">
      <i class="ti ti-clock-history" aria-hidden="true"></i>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchNav(this)">
      <i class="ti ti-camera" aria-hidden="true"></i>
      <div class="nav-dot"></div>
      <span>스캔</span>
    </div>
    <div class="nav-item" onclick="switchNav(this)">
      <i class="ti ti-book-2" aria-hidden="true"></i>
      <div class="nav-dot"></div>
      <span>도감</span>
    </div>
    <div class="nav-item" onclick="switchNav(this)">
      <i class="ti ti-map-pin" aria-hidden="true"></i>
      <div class="nav-dot"></div>
      <span>지도</span>
    </div>
    <div class="nav-item" onclick="switchNav(this)">
      <i class="ti ti-user" aria-hidden="true"></i>
      <div class="nav-dot"></div>
      <span>내 기록</span>
    </div>
  </nav>

</div>

<script>
/* =============================================================
   CONFIG — Teachable Machine
   modelURL : Export 패널에서 복사한 모델 주소 (끝에 / 포함)
   ============================================================= */
const TM_CONFIG = {
  modelURL: "https://teachablemachine.withgoogle.com/models/i9gpJrJau/",
};

/* =============================================================
   교란종 정보 테이블
   ⚠ 키(왼쪽)는 Teachable Machine에서 만든 클래스 이름과 정확히 똑같아야 함
   ============================================================= */
const PLANT_INFO = {
  '가시박':        { latin: 'Sicyos angulatus',        invasive: true },
  '돼지풀':        { latin: 'Ambrosia artemisiifolia',  invasive: true },
  '단풍잎 돼지풀': { latin: 'Ambrosia trifida',          invasive: true },
  '환삼덩굴':      { latin: 'Humulus japonicus',        invasive: true },
};

/* =============================================================
   STATE
   ============================================================= */
let cameraStream = null;
let isScanning   = false;
let tmModel      = null;
let IS_LIVE      = false;   // Teachable Machine 모델 로딩 완료 시 true

const viewport      = document.getElementById('viewport');
const videoFeed     = document.getElementById('videoFeed');
const shutterBtn    = document.getElementById('shutterBtn');
const resultPanel   = document.getElementById('resultPanel');
const resultContent = document.getElementById('resultContent');

/* =============================================================
   INIT
   ============================================================= */
window.addEventListener('DOMContentLoaded', async () => {
  updateClock();
  setInterval(updateClock, 10000);

  const banner = document.getElementById('demoBanner');
  try {
    await loadTMModel();
    IS_LIVE = true;
    if (banner) banner.remove();
  } catch (err) {
    console.error('모델 로딩 실패:', err);
    if (banner) banner.textContent = '⚠ AI 모델을 불러오지 못했습니다. 새로고침해주세요.';
  }
});

/* =============================================================
   CLOCK
   ============================================================= */
function updateClock() {
  const now = new Date();
  const h   = String(now.getHours()).padStart(2, '0');
  const m   = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clockDisplay').textContent = h + ':' + m;
}

/* =============================================================
   CAMERA
   ============================================================= */
async function initCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false,
    });
    videoFeed.srcObject = cameraStream;
    videoFeed.classList.add('active');
    viewport.classList.add('has-video');
  } catch (err) {
    console.warn('카메라 접근 실패:', err);
    showError('카메라 접근 권한이 필요합니다.\n브라우저 설정에서 허용해주세요.');
  }
}

function handleViewportTap() {
  if (!cameraStream) initCamera();
}

/* =============================================================
   TEACHABLE MACHINE 클라이언트 (전부 브라우저 안에서 처리, 서버 호출 없음)
   ============================================================= */

/** 모델 로딩 */
async function loadTMModel() {
  tmModel = await tmImage.load(TM_CONFIG.modelURL + 'model.json', TM_CONFIG.modelURL + 'metadata.json');
}

/** canvas(또는 image/video) → 판별 결과 */
async function classifyWithTM(canvasEl) {
  const predictions = await tmModel.predict(canvasEl);

  let top = predictions[0];
  for (const p of predictions) {
    if (p.probability > top.probability) top = p;
  }

  const info = PLANT_INFO[top.className] || {};

  return {
    found:      true,
    name:       top.className,
    latin:      info.latin || '',
    invasive:   info.invasive ?? true,
    confidence: Math.round(top.probability * 100),
  };
}

/* =============================================================
   DEMO MODE  (모델 로딩 실패 시 대체 표시)
   ============================================================= */
const DEMO_RESULTS = [
  { found:true, name:'가시박',        latin:'Sicyos angulatus',       invasive:true, confidence:94 },
  { found:true, name:'환삼덩굴',      latin:'Humulus japonicus',      invasive:true, confidence:88 },
  { found:true, name:'돼지풀',        latin:'Ambrosia artemisiifolia',invasive:true, confidence:85 },
  { found:true, name:'단풍잎 돼지풀', latin:'Ambrosia trifida',       invasive:true, confidence:90 },
];
let demoIdx = 0;
function getDemoResult() { return DEMO_RESULTS[demoIdx++ % DEMO_RESULTS.length]; }

/** sleep */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* =============================================================
   CAPTURE & INFERENCE
   ============================================================= */
async function triggerCapture() {
  if (isScanning) return;
  if (!cameraStream) { await initCamera(); return; }

  isScanning = true;
  setScanning(true);

  try {
    const canvas = document.getElementById('captureCanvas');
    const ctx    = canvas.getContext('2d');
    ctx.drawImage(videoFeed, 0, 0, canvas.width, canvas.height);

    let result;

    if (IS_LIVE) {
      result = await classifyWithTM(canvas);
    } else {
      // 모델 로딩 실패 시 대체 표시
      await sleep(1200);
      result = getDemoResult();
    }

    showResult(result);

  } catch (err) {
    console.error('추론 오류:', err);
    showError('분석 중 오류가 발생했습니다. 다시 시도해주세요.');
  } finally {
    isScanning = false;
    setScanning(false);
  }
}

/* =============================================================
   GALLERY
   ============================================================= */
function openGallery() { document.getElementById('galleryInput').click(); }

async function handleGalleryImage(e) {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = async () => {
    isScanning = true;
    setScanning(true);

    viewport.style.backgroundImage    = `url(${img.src})`;
    viewport.style.backgroundSize     = 'cover';
    viewport.style.backgroundPosition = 'center';

    const canvas = document.getElementById('captureCanvas');
    const ctx    = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let result;
    try {
      if (IS_LIVE) {
        result = await classifyWithTM(canvas);
      } else {
        await sleep(1000);
        result = getDemoResult();
      }
      showResult(result);
    } catch (err) {
      console.error('갤러리 추론 오류:', err);
      showError('분석 중 오류가 발생했습니다. 다시 시도해주세요.');
    } finally {
      isScanning = false;
      setScanning(false);
    }
  };
  img.src        = URL.createObjectURL(file);
  e.target.value = '';
}

/* =============================================================
   UI — RESULT
   ============================================================= */
function showResult(result) {
  if (!result.found) {
    resultContent.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">식물을 인식하지 못했습니다. 다시 시도해주세요.</span>';
    resultPanel.className   = 'result-panel';
    viewport.className      = 'camera-viewport has-video';
    return;
  }

  const cls       = result.invasive ? 'invasive' : 'native';
  const icon      = result.invasive ? 'ti-alert-triangle' : 'ti-check';
  const text      = result.invasive ? '교란종' : '자생종';
  const fillColor = result.invasive ? '#c04040' : 'var(--accent)';

  resultPanel.className = 'result-panel ' + cls;
  viewport.classList.remove('result-invasive', 'result-native');
  viewport.classList.add('result-' + cls);

  resultContent.innerHTML = `
    <div class="result-name">${result.name}</div>
    ${result.latin ? `<div class="result-latin">${result.latin}</div>` : ''}
    <div class="result-meta">
      <span class="status-badge ${cls}">
        <i class="ti ${icon}" style="font-size:12px;" aria-hidden="true"></i>${text}
      </span>
      <span class="confidence-text">${result.confidence}% 신뢰도</span>
    </div>
    <div class="confidence-bar">
      <div class="confidence-fill" id="cfill" style="background:${fillColor};"></div>
    </div>
  `;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const fill = document.getElementById('cfill');
    if (fill) fill.style.width = result.confidence + '%';
  }));

  saveToHistory(result);
}

function showError(msg) {
  resultPanel.className   = 'result-panel';
  resultContent.innerHTML = `<span style="color:var(--text-muted);font-size:13px;">${msg}</span>`;
}

/* =============================================================
   UI — SCANNING STATE
   ============================================================= */
function setScanning(on) {
  if (on) {
    viewport.classList.add('scanning');
    shutterBtn.classList.add('scanning');
    document.getElementById('shutterIcon').className = 'ti ti-loader';
    resultPanel.className   = 'result-panel';
    resultContent.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">AI 분석 중...</span>';
  } else {
    viewport.classList.remove('scanning');
    shutterBtn.classList.remove('scanning');
    document.getElementById('shutterIcon').className = 'ti ti-camera';
  }
}

/* =============================================================
   HISTORY  (localStorage, 최대 100건)
   ============================================================= */
function saveToHistory(result) {
  try {
    const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    history.unshift({
      name:       result.name,
      latin:      result.latin || '',
      invasive:   result.invasive,
      confidence: result.confidence,
      timestamp:  new Date().toISOString(),
    });
    localStorage.setItem('scanHistory', JSON.stringify(history.slice(0, 100)));
  } catch (_) {}
}

function showHistory() {
  try {
    const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    if (!history.length) { alert('아직 스캔 기록이 없습니다.'); return; }
    const lines = history.slice(0, 5).map(h => {
      const d     = new Date(h.timestamp);
      const label = h.invasive ? '⚠ 교란종' : '✓ 자생종';
      return `${label}  ${h.name}  (${h.confidence}%)  ${d.getMonth()+1}/${d.getDate()}`;
    });
    alert('최근 스캔 기록\n\n' + lines.join('\n'));
  } catch (_) {}
}

/* =============================================================
   BOTTOM NAV
   ============================================================= */
function switchNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
</script>
